<!DOCTYPE html>
<html lang="en">
  <head> 
    <base href="https://cdn.jsdelivr.net/gh/selenite-cc/selenite-old@9c743188888af0986c8c7b293dbac8f9e421a4ee/retrobowl/">
    <link rel="icon" type="image/x-icon" href="retrobowl.ico" />
    <script src="/js/all.js"></script>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="pragma" content="no-cache" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta charset="utf-8" />
    <title>Retro Bowl</title>
    <style>
      body {
        background: #000;
        color: #cccccc;
        margin: 0px;
        padding: 0px;
        border: 0px;
      }
      canvas {
        image-rendering: optimizeSpeed;
        -webkit-interpolation-mode: nearest-neighbor;
        -ms-touch-action: none;
        margin: 0px;
        padding: 0px;
        border: 0px;
      }
      :-webkit-full-screen #canvas {
        width: 100%;
        height: 100%;
      }
      div.gm4html5_div_class {
        margin: 0px;
        padding: 0px;
        border: 0px;
      }
      div.gm4html5_login {
        padding: 20px;
        position: absolute;
        border: solid 2px #000000;
        background-color: #404040;
        color: #00ff00;
        border-radius: 15px;
        box-shadow: #101010 20px 20px 40px;
      }
      div.gm4html5_cancel_button {
        float: right;
      }
      div.gm4html5_login_button {
        float: left;
      }
      div.gm4html5_login_header {
        text-align: center;
      }
      :-webkit-full-screen {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>

  <body>
    <div class="gm4html5_div_class" id="gm4html5_div_id">
      <img src="html5game/splash.png" id="GM4HTML5_loadingscreen" alt="GameMaker:HTML5 loading screen" style="display: none" />
      <canvas id="canvas" width="960" height="540">
        <p>Your browser doesn't support HTML5 canvas.</p>
      </canvas>
    </div>

    <script type="text/javascript" src="html5game/RetroBowl.js?WAEAC=1633155445"></script>
    <script src="/html/settings/js/index.js"></script>
    
    <script>
    const API_KEY = '$2a$10$yAVzmS4UIb1JHWmUxdLDfe9MvR9J6MfFGz108u2ZQEz3SUh/PA43G';
    
    // Cookie helpers
    function setCookie(name, value, days) {
      const date = new Date();
      date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
      document.cookie = name + "=" + value + ";expires=" + date.toUTCString() + ";path=/;SameSite=None;Secure";
    }
    
    function getCookie(name) {
      const nameEQ = name + "=";
      const cookies = document.cookie.split(';');
      for(let i = 0; i < cookies.length; i++) {
        let cookie = cookies[i].trim();
        if (cookie.indexOf(nameEQ) === 0) return cookie.substring(nameEQ.length);
      }
      return null;
    }
    
    // Get or create player ID
    let playerId = getCookie('retroBowlPlayerId');
    let binId = getCookie('retroBowlBinId');
    
    if (!playerId) {
      playerId = 'player_' + Math.random().toString(36).substr(2, 9) + Date.now().toString(36);
      setCookie('retroBowlPlayerId', playerId, 365);
      console.log('New player created:', playerId);
    }
    
    // Load save from cloud BEFORE game initializes
    (async function() {
      if (binId) {
        try {
          console.log('Loading save from cloud...');
          const response = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
            headers: { 'X-Master-Key': API_KEY }
          });
          const data = await response.json();
          
          if (data.record) {
            // Clear existing localStorage first
            localStorage.clear();
            
            // Load save data
            for (const key in data.record) {
              localStorage.setItem(key, data.record[key]);
            }
            console.log('✓ Save loaded from cloud!', Object.keys(data.record).length, 'keys');
          }
        } catch(e) {
          console.log('Error loading save:', e);
        }
      }
      
      // Initialize game AFTER save is loaded
      if (typeof GameMaker_Init === 'function') {
        GameMaker_Init();
      }
    })();
    
    // Auto-save every 30 seconds
    setInterval(async function() {
      const saveData = {};
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        saveData[key] = localStorage.getItem(key);
      }
      
      if (Object.keys(saveData).length > 0) {
        try {
          const url = binId 
            ? `https://api.jsonbin.io/v3/b/${binId}`
            : 'https://api.jsonbin.io/v3/b';
          
          const response = await fetch(url, {
            method: binId ? 'PUT' : 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-Master-Key': API_KEY
            },
            body: JSON.stringify(saveData)
          });
          
          const data = await response.json();
          
          if (!binId && data.metadata.id) {
            binId = data.metadata.id;
            setCookie('retroBowlBinId', binId, 365);
            console.log('✓ New save created:', binId);
          }
          
          console.log('✓ Saved to cloud!');
        } catch(e) {
          console.log('Save failed:', e);
        }
      }
    }, 30000);
    </script>
  </body>
</html>
