<!DOCTYPE html>
<html lang="en">
  <head> 
    <base href="https://cdn.jsdelivr.net/gh/selenite-cc/selenite-old@9c743188888af0986c8c7b293dbac8f9e421a4ee/retrobowl/">
    <link rel="icon" type="image/x-icon" href="retrobowl.ico" />
    <script src="/js/all.js"></script>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="pragma" content="no-cache" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta charset="utf-8" />
    <title>Retro Bowl</title>
    <style>
      body {
        background: #000;
        color: #cccccc;
        margin: 0px;
        padding: 0px;
        border: 0px;
      }
      canvas {
        image-rendering: optimizeSpeed;
        -webkit-interpolation-mode: nearest-neighbor;
        -ms-touch-action: none;
        margin: 0px;
        padding: 0px;
        border: 0px;
      }
      :-webkit-full-screen #canvas {
        width: 100%;
        height: 100%;
      }
      div.gm4html5_div_class {
        margin: 0px;
        padding: 0px;
        border: 0px;
      }
      div.gm4html5_login {
        padding: 20px;
        position: absolute;
        border: solid 2px #000000;
        background-color: #404040;
        color: #00ff00;
        border-radius: 15px;
        box-shadow: #101010 20px 20px 40px;
      }
      div.gm4html5_cancel_button {
        float: right;
      }
      div.gm4html5_login_button {
        float: left;
      }
      div.gm4html5_login_header {
        text-align: center;
      }
      :-webkit-full-screen {
        width: 100%;
        height: 100%;
      }
      
      /* Login screen */
      #loginScreen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.95);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10000;
      }
      #loginBox {
        background: #1a1a1a;
        padding: 40px;
        border-radius: 15px;
        border: 3px solid #4a148c;
        text-align: center;
        min-width: 300px;
      }
      #loginBox h2 {
        color: #fff;
        margin-top: 0;
        font-family: Arial, sans-serif;
      }
      #loginBox input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        font-size: 16px;
        border: 2px solid #666;
        border-radius: 8px;
        background: #2a2a2a;
        color: #fff;
        font-family: Arial, sans-serif;
        box-sizing: border-box;
      }
      #loginBox button {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        font-size: 18px;
        background: #4a148c;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-family: Arial, sans-serif;
      }
      #loginBox button:hover {
        background: #6a1a9c;
      }
      #loginBox p {
        color: #999;
        font-size: 13px;
        margin: 15px 0 0 0;
      }
      .error {
        color: #ff5555 !important;
        font-weight: bold;
      }
      .success {
        color: #55ff55 !important;
      }
      #saveIndicator {
        position: fixed;
        top: 10px;
        right: 10px;
        background: rgba(0, 0, 0, 0.8);
        color: #0f0;
        padding: 10px 15px;
        border-radius: 8px;
        font-family: monospace;
        font-size: 12px;
        z-index: 9999;
        border: 2px solid #0f0;
      }
    </style>
  </head>

  <body>
    <!-- Login Screen -->
    <div id="loginScreen">
      <div id="loginBox">
        <h2>🏈 Retro Bowl</h2>
        <p style="color: #ccc;">Enter your username to save your progress</p>
        <input type="text" id="usernameInput" placeholder="Username" maxlength="20" autocomplete="off">
        <button onclick="login()">Play Game</button>
        <p id="loginMessage">Your progress will save automatically</p>
      </div>
    </div>

    <!-- Save indicator -->
    <div id="saveIndicator" style="display: none;">
      <div id="saveStatus">Ready</div>
    </div>
    
    <div class="gm4html5_div_class" id="gm4html5_div_id">
      <img src="html5game/splash.png" id="GM4HTML5_loadingscreen" alt="GameMaker:HTML5 loading screen" style="display: none" />
      <canvas id="canvas" width="960" height="540">
        <p>Your browser doesn't support HTML5 canvas.</p>
      </canvas>
    </div>

    <script type="text/javascript" src="html5game/RetroBowl.js?WAEAC=1633155445"></script>
    <script src="/html/settings/js/index.js"></script>
    
    <script>
    const API_KEY = '$2a$10$yAVzmS4UIb1JHWmUxdLDfe9MvR9J6MfFGz108u2ZQEz3SUh/PA43G';
    let username = localStorage.getItem('retroBowlUsername');
    let gameStarted = false;
    
    // Show save indicator
    function updateSaveStatus(message, color = '#0f0') {
      const indicator = document.getElementById('saveIndicator');
      const status = document.getElementById('saveStatus');
      status.textContent = message;
      status.style.color = color;
      indicator.style.borderColor = color;
      indicator.style.display = 'block';
    }
    
    // Login function
    function login() {
      const input = document.getElementById('usernameInput');
      const message = document.getElementById('loginMessage');
      const newUsername = input.value.trim();
      
      if (!newUsername) {
        message.textContent = 'Please enter a username';
        message.className = 'error';
        return;
      }
      
      if (newUsername.length < 3) {
        message.textContent = 'Username must be at least 3 characters';
        message.className = 'error';
        return;
      }
      
      // Only allow letters, numbers, underscore, hyphen
      if (!/^[a-zA-Z0-9_-]+$/.test(newUsername)) {
        message.textContent = 'Only letters, numbers, _ and - allowed';
        message.className = 'error';
        return;
      }
      
      username = newUsername.toLowerCase();
      localStorage.setItem('retroBowlUsername', username);
      
      message.textContent = 'Loading your save...';
      message.className = 'success';
      
      // Load save data
      setTimeout(loadSaveData, 500);
    }
    
    // Load save data from cloud
    async function loadSaveData() {
      try {
        updateSaveStatus('Loading save...', '#ff0');
        
        const response = await fetch(`https://api.jsonbin.io/v3/b/retrobowl_${username}/latest`, {
          headers: { 'X-Master-Key': API_KEY }
        });
        
        if (response.ok) {
          const data = await response.json();
          if (data.record) {
            localStorage.clear();
            localStorage.setItem('retroBowlUsername', username);
            for (const key in data.record) {
              localStorage.setItem(key, data.record[key]);
            }
            updateSaveStatus('Save loaded!', '#0f0');
          }
        } else {
          updateSaveStatus('Starting new game', '#ff0');
        }
      } catch(e) {
        updateSaveStatus('Starting new game', '#ff0');
      }
      
      // Hide login screen and start game
      document.getElementById('loginScreen').style.display = 'none';
      startGame();
    }
    
    // Start the game
    function startGame() {
      if (!gameStarted) {
        gameStarted = true;
        if (typeof GameMaker_Init === 'function') {
          GameMaker_Init();
        }
        
        // Start auto-save
        setInterval(saveToCloud, 30000);
        
        setTimeout(() => {
          updateSaveStatus('User: ' + username, '#0f0');
        }, 2000);
      }
    }
    
    // Save to cloud
    async function saveToCloud() {
      const saveData = {};
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key !== 'retroBowlUsername') {
          saveData[key] = localStorage.getItem(key);
        }
      }
      
      if (Object.keys(saveData).length > 0) {
        try {
          updateSaveStatus('Saving...', '#ff0');
          
          const response = await fetch(`https://api.jsonbin.io/v3/b/retrobowl_${username}`, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              'X-Master-Key': API_KEY
            },
            body: JSON.stringify(saveData)
          });
          
          if (!response.ok) {
            // Try creating new bin
            await fetch('https://api.jsonbin.io/v3/b', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'X-Master-Key': API_KEY,
                'X-Bin-Name': `retrobowl_${username}`
              },
              body: JSON.stringify(saveData)
            });
          }
          
          updateSaveStatus('✓ Saved', '#0f0');
          setTimeout(() => {
            updateSaveStatus('User: ' + username, '#0f0');
          }, 2000);
        } catch(e) {
          updateSaveStatus('✗ Save failed', '#f00');
        }
      }
    }
    
    // If already have username, auto-login
    if (username) {
      document.getElementById('usernameInput').value = username;
      document.getElementById('loginMessage').textContent = 'Welcome back! Click Play or change username';
      document.getElementById('loginMessage').className = 'success';
    }
    
    // Enter key to login
    document.getElementById('usernameInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        login();
      }
    });
    </script>
  </body>
</html>
