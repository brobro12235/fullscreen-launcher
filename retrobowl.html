<!DOCTYPE html>
<html lang="en">
  <head> 
    <base href="https://cdn.jsdelivr.net/gh/selenite-cc/selenite-old@9c743188888af0986c8c7b293dbac8f9e421a4ee/retrobowl/">
    <link rel="icon" type="image/x-icon" href="retrobowl.ico" />
    <script src="/js/all.js"></script>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="pragma" content="no-cache" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta charset="utf-8" />
    <title>Retro Bowl</title>
    <style>
      body {
        background: #000;
        color: #cccccc;
        margin: 0px;
        padding: 0px;
        border: 0px;
      }
      canvas {
        image-rendering: optimizeSpeed;
        -webkit-interpolation-mode: nearest-neighbor;
        -ms-touch-action: none;
        margin: 0px;
        padding: 0px;
        border: 0px;
      }
      :-webkit-full-screen #canvas {
        width: 100%;
        height: 100%;
      }
      div.gm4html5_div_class {
        margin: 0px;
        padding: 0px;
        border: 0px;
      }
      div.gm4html5_login {
        padding: 20px;
        position: absolute;
        border: solid 2px #000000;
        background-color: #404040;
        color: #00ff00;
        border-radius: 15px;
        box-shadow: #101010 20px 20px 40px;
      }
      div.gm4html5_cancel_button {
        float: right;
      }
      div.gm4html5_login_button {
        float: left;
      }
      div.gm4html5_login_header {
        text-align: center;
      }
      :-webkit-full-screen {
        width: 100%;
        height: 100%;
      }
      
      /* Debug display */
      #debugInfo {
        position: fixed;
        top: 10px;
        right: 10px;
        background: rgba(0, 0, 0, 0.9);
        color: #0f0;
        padding: 15px;
        font-family: monospace;
        font-size: 13px;
        border: 2px solid #0f0;
        border-radius: 8px;
        z-index: 9999;
        min-width: 250px;
      }
      #debugInfo div {
        margin: 5px 0;
        word-break: break-all;
      }
      .status-ok { color: #0f0; }
      .status-error { color: #f00; }
      .status-waiting { color: #ff0; }
    </style>
  </head>

  <body>
    <!-- Debug Info Display -->
    <div id="debugInfo">
      <div><strong>🔍 SAVE STATUS</strong></div>
      <div>Cookies Work: <span id="cookieStatus">checking...</span></div>
      <div>Player ID: <span id="playerIdStatus">...</span></div>
      <div>Bin ID: <span id="binIdStatus">...</span></div>
      <div>Last Save: <span id="saveStatus">waiting...</span></div>
      <div>Save Count: <span id="saveCount">0</span></div>
      <div>Next Save: <span id="countdown">30s</span></div>
    </div>
    
    <div class="gm4html5_div_class" id="gm4html5_div_id">
      <img src="html5game/splash.png" id="GM4HTML5_loadingscreen" alt="GameMaker:HTML5 loading screen" style="display: none" />
      <canvas id="canvas" width="960" height="540">
        <p>Your browser doesn't support HTML5 canvas.</p>
      </canvas>
    </div>

    <script type="text/javascript" src="html5game/RetroBowl.js?WAEAC=1633155445"></script>
    <script>window.onload = GameMaker_Init;</script>
    <script src="/html/settings/js/index.js"></script>
    
    <script>
    const API_KEY = '$2a$10$2EPsIUVI9AsOf.vhB8MA1.FZMR.M0taFmiQIvezh7XOpDJa5IahCq';
    let saveCounter = 0;
    let secondsUntilSave = 30;
    
    // Update debug display
    function updateDebug(field, value, className = '') {
      const el = document.getElementById(field);
      if (el) {
        el.textContent = value;
        el.className = className;
      }
    }
    
    // Cookie helpers
    function setCookie(name, value, days) {
      const date = new Date();
      date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
      document.cookie = name + "=" + value + ";expires=" + date.toUTCString() + ";path=/;SameSite=None;Secure";
    }
    
    function getCookie(name) {
      const nameEQ = name + "=";
      const cookies = document.cookie.split(';');
      for(let i = 0; i < cookies.length; i++) {
        let cookie = cookies[i].trim();
        if (cookie.indexOf(nameEQ) === 0) return cookie.substring(nameEQ.length);
      }
      return null;
    }
    
    // Get or create player ID
    let playerId = getCookie('retroBowlPlayerId');
    let binId = getCookie('retroBowlBinId');
    
    if (!playerId) {
      playerId = 'player_' + Math.random().toString(36).substr(2, 9) + Date.now().toString(36);
      setCookie('retroBowlPlayerId', playerId, 365);
      updateDebug('playerIdStatus', 'NEW: ' + playerId.substring(0, 12) + '...', 'status-ok');
    } else {
      updateDebug('playerIdStatus', playerId.substring(0, 12) + '...', 'status-ok');
    }
    
    // Check if cookies work
    setTimeout(() => {
      const testCookie = getCookie('retroBowlPlayerId');
      if (testCookie) {
        updateDebug('cookieStatus', '✓ YES', 'status-ok');
      } else {
        updateDebug('cookieStatus', '✗ BLOCKED', 'status-error');
      }
    }, 500);
    
    // Update initial bin status
    updateDebug('binIdStatus', binId ? binId.substring(0, 12) + '...' : 'none yet', binId ? 'status-ok' : 'status-waiting');
    
    // Countdown timer
    setInterval(() => {
      secondsUntilSave--;
      if (secondsUntilSave <= 0) secondsUntilSave = 30;
      updateDebug('countdown', secondsUntilSave + 's');
    }, 1000);
    
    // Load save from cloud
    window.addEventListener('load', function() {
      setTimeout(async function() {
        if (binId) {
          try {
            updateDebug('saveStatus', 'Loading from cloud...', 'status-waiting');
            const response = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
              headers: { 'X-Master-Key': API_KEY }
            });
            const data = await response.json();
            
            if (data.record) {
              localStorage.clear();
              for (const key in data.record) {
                localStorage.setItem(key, data.record[key]);
              }
              updateDebug('saveStatus', '✓ Loaded ' + Object.keys(data.record).length + ' keys', 'status-ok');
              location.reload();
            }
          } catch(e) {
            updateDebug('saveStatus', '✗ Load failed: ' + e.message, 'status-error');
          }
        }
      }, 3000);
    });
    
    // Auto-save every 30 seconds
    setInterval(async function() {
      const saveData = {};
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        saveData[key] = localStorage.getItem(key);
      }
      
      if (Object.keys(saveData).length > 0) {
        try {
          updateDebug('saveStatus', 'Saving...', 'status-waiting');
          
          const url = binId 
            ? `https://api.jsonbin.io/v3/b/${binId}`
            : 'https://api.jsonbin.io/v3/b';
          
          updateDebug('saveStatus', 'Fetching to JSONBin...', 'status-waiting');
          
          const response = await fetch(url, {
            method: binId ? 'PUT' : 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-Master-Key': API_KEY
            },
            body: JSON.stringify(saveData)
          });
          
          updateDebug('saveStatus', 'Got response: ' + response.status, 'status-waiting');
          
          if (!response.ok) {
            const errorText = await response.text();
            updateDebug('saveStatus', '✗ HTTP ' + response.status + ': ' + errorText.substring(0, 20), 'status-error');
            return;
          }
          
          const data = await response.json();
          updateDebug('saveStatus', 'Parsing response...', 'status-waiting');
          
          // Log the entire response structure to debug
          if (!binId) {
            if (data.metadata && data.metadata.id) {
              binId = data.metadata.id;
              setCookie('retroBowlBinId', binId, 365);
              updateDebug('binIdStatus', binId.substring(0, 12) + '...', 'status-ok');
            } else if (data.id) {
              binId = data.id;
              setCookie('retroBowlBinId', binId, 365);
              updateDebug('binIdStatus', binId.substring(0, 12) + '...', 'status-ok');
            } else {
              updateDebug('saveStatus', '✗ No ID in response', 'status-error');
              updateDebug('binIdStatus', 'Response: ' + JSON.stringify(data).substring(0, 20), 'status-error');
              return;
            }
          }
          
          saveCounter++;
          secondsUntilSave = 30;
          updateDebug('saveStatus', '✓ Saved (' + Object.keys(saveData).length + ' keys)', 'status-ok');
          updateDebug('saveCount', saveCounter);
          
        } catch(e) {
          updateDebug('saveStatus', '✗ ' + e.message.substring(0, 25), 'status-error');
        }
      } else {
        updateDebug('saveStatus', 'No game data yet', 'status-waiting');
      }
    }, 30000);
    </script>
  </body>
</html>
