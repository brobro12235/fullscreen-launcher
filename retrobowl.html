<!DOCTYPE html>
<html lang="en">
  <head> 
    <base href="https://cdn.jsdelivr.net/gh/selenite-cc/selenite-old@9c743188888af0986c8c7b293dbac8f9e421a4ee/retrobowl/">
    <link rel="icon" type="image/x-icon" href="retrobowl.ico" />
    <script src="/js/all.js"></script>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="pragma" content="no-cache" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta charset="utf-8" />
    <title>Retro Bowl</title>
    <style>
      body {
        background: #000;
        color: #cccccc;
        margin: 0px;
        padding: 0px;
        border: 0px;
      }
      canvas {
        image-rendering: optimizeSpeed;
        -webkit-interpolation-mode: nearest-neighbor;
        -ms-touch-action: none;
        margin: 0px;
        padding: 0px;
        border: 0px;
      }
      :-webkit-full-screen #canvas {
        width: 100%;
        height: 100%;
      }
      div.gm4html5_div_class {
        margin: 0px;
        padding: 0px;
        border: 0px;
      }
      div.gm4html5_login {
        padding: 20px;
        position: absolute;
        border: solid 2px #000000;
        background-color: #404040;
        color: #00ff00;
        border-radius: 15px;
        box-shadow: #101010 20px 20px 40px;
      }
      div.gm4html5_cancel_button {
        float: right;
      }
      div.gm4html5_login_button {
        float: left;
      }
      div.gm4html5_login_header {
        text-align: center;
      }
      :-webkit-full-screen {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>

  <body>
    <div class="gm4html5_div_class" id="gm4html5_div_id">
      <img src="html5game/splash.png" id="GM4HTML5_loadingscreen" alt="GameMaker:HTML5 loading screen" style="display: none" />
      <canvas id="canvas" width="960" height="540">
        <p>Your browser doesn't support HTML5 canvas.</p>
      </canvas>
    </div>

    <script type="text/javascript" src="html5game/RetroBowl.js?WAEAC=1633155445"></script>
    <script>window.onload = GameMaker_Init;</script>
    <script src="/html/settings/js/index.js"></script>
    
    <!-- Save/Load functionality -->
    <script>
    setTimeout(function() {
      const saveDiv = document.createElement('div');
      saveDiv.style.cssText = 'position:fixed;top:10px;right:10px;z-index:9999;background:rgba(0,0,0,0.8);padding:10px;border-radius:8px;';
      saveDiv.innerHTML = '<button onclick="window.exportSave()" style="padding:8px 12px;margin:5px;background:#4CAF50;color:white;border:none;border-radius:5px;cursor:pointer;font-size:12px;">💾 Download Save</button><button onclick="window.importSave()" style="padding:8px 12px;margin:5px;background:#2196F3;color:white;border:none;border-radius:5px;cursor:pointer;font-size:12px;">📁 Upload Save</button>';
      document.body.appendChild(saveDiv);
    }, 2000);
    
    window.exportSave = function() {
      const saveData = {};
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        saveData[key] = localStorage.getItem(key);
      }
      const blob = new Blob([JSON.stringify(saveData)], {type: 'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'retrobowl-save.json';
      a.click();
      URL.revokeObjectURL(url);
      alert('Save downloaded! Keep this file to restore your progress later.');
    };
    
    window.importSave = function() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = e => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = event => {
          try {
            const saveData = JSON.parse(event.target.result);
            for (const key in saveData) {
              localStorage.setItem(key, saveData[key]);
            }
            alert('Save loaded successfully! Refreshing...');
            location.reload();
          } catch(err) {
            alert('Error loading save file. Make sure it is a valid Retro Bowl save.');
          }
        };
        reader.readAsText(file);
      };
      input.click();
    };
    </script>
  </body>
</html>
