<body>
    <div class="gm4html5_div_class" id="gm4html5_div_id">
      <img
        src="html5game/splash.png"
        id="GM4HTML5_loadingscreen"
        alt="GameMaker:HTML5 loading screen"
        style="display: none"
      />
      <!-- Create the canvas element the game draws to -->
      <canvas id="canvas" width="960" height="540">
        <p>Your browser doesn't support HTML5 canvas.</p>
      </canvas>
    </div>

    <!-- ADD THE SAVE BUTTONS HERE -->
    <div style="position:fixed; top:10px; right:10px; z-index:9999; background:rgba(0,0,0,0.8); padding:10px; border-radius:8px;">
      <button onclick="exportSave()" style="padding:8px 12px; margin:5px; background:#4CAF50; color:white; border:none; border-radius:5px; cursor:pointer; font-size:12px;">
        💾 Download Save
      </button>
      <button onclick="importSave()" style="padding:8px 12px; margin:5px; background:#2196F3; color:white; border:none; border-radius:5px; cursor:pointer; font-size:12px;">
        📁 Upload Save
      </button>
    </div>

    <!-- Run the game code -->
    <script
      type="text/javascript"
      src="html5game/RetroBowl.js?WAEAC=1633155445"
    ></script>
    <script>
      window.onload = GameMaker_Init;
    </script>
    
    <!-- ADD THE SAVE FUNCTIONS HERE -->
    <script>
    function exportSave() {
      const saveData = {};
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        saveData[key] = localStorage.getItem(key);
      }
      
      const blob = new Blob([JSON.stringify(saveData)], {type: 'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'retrobowl-save-' + Date.now() + '.json';
      a.click();
      URL.revokeObjectURL(url);
      alert('Save downloaded! Keep this file safe.');
    }

    function importSave() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = e => {
        const file = e.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = event => {
          try {
            const saveData = JSON.parse(event.target.result);
            for (const key in saveData) {
              localStorage.setItem(key, saveData[key]);
            }
            alert('Save loaded! Refresh the page to see your progress.');
            location.reload();
          } catch (err) {
            alert('Error loading save file: ' + err.message);
          }
        };
        reader.readAsText(file);
      };
      input.click();
    }
    </script>
    
    <script src="/html/settings/js/index.js"></script> 
</body>
</html>
