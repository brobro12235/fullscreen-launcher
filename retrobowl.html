<!DOCTYPE html>
<html lang="en">
  <head> 
    <base href="https://cdn.jsdelivr.net/gh/selenite-cc/selenite-old@9c743188888af0986c8c7b293dbac8f9e421a4ee/retrobowl/">
    <link rel="icon" type="image/x-icon" href="retrobowl.ico" />
    <script src="/js/all.js"></script>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="pragma" content="no-cache" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta charset="utf-8" />
    <title>Retro Bowl</title>
    <style>
      body {
        background: #000;
        color: #cccccc;
        margin: 0px;
        padding: 0px;
        border: 0px;
      }
      canvas {
        image-rendering: optimizeSpeed;
        -webkit-interpolation-mode: nearest-neighbor;
        -ms-touch-action: none;
        margin: 0px;
        padding: 0px;
        border: 0px;
      }
      :-webkit-full-screen #canvas {
        width: 100%;
        height: 100%;
      }
      div.gm4html5_div_class {
        margin: 0px;
        padding: 0px;
        border: 0px;
      }
      div.gm4html5_login {
        padding: 20px;
        position: absolute;
        border: solid 2px #000000;
        background-color: #404040;
        color: #00ff00;
        border-radius: 15px;
        box-shadow: #101010 20px 20px 40px;
      }
      div.gm4html5_cancel_button {
        float: right;
      }
      div.gm4html5_login_button {
        float: left;
      }
      div.gm4html5_login_header {
        text-align: center;
      }
      :-webkit-full-screen {
        width: 100%;
        height: 100%;
      }
      
      /* Login screen */
      #loginScreen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.95);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10000;
      }
      #loginBox {
        background: #1a1a1a;
        padding: 40px;
        border-radius: 15px;
        border: 3px solid #4a148c;
        text-align: center;
        min-width: 300px;
        max-width: 400px;
      }
      #loginBox h2 {
        color: #fff;
        margin-top: 0;
        font-family: Arial, sans-serif;
      }
      #loginBox input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        font-size: 16px;
        border: 2px solid #666;
        border-radius: 8px;
        background: #2a2a2a;
        color: #fff;
        font-family: Arial, sans-serif;
        box-sizing: border-box;
      }
      #loginBox button {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        font-size: 18px;
        background: #4a148c;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-family: Arial, sans-serif;
      }
      #loginBox button:hover {
        background: #6a1a9c;
      }
      #loginBox p {
        color: #999;
        font-size: 13px;
        margin: 15px 0 0 0;
      }
      .error {
        color: #ff5555 !important;
        font-weight: bold;
      }
      .success {
        color: #55ff55 !important;
      }
      #saveIndicator {
        position: fixed;
        top: 10px;
        right: 10px;
        background: rgba(0, 0, 0, 0.8);
        color: #0f0;
        padding: 10px 15px;
        border-radius: 8px;
        font-family: monospace;
        font-size: 12px;
        z-index: 9999;
        border: 2px solid #0f0;
      }
    </style>
  </head>

  <body>
    <!-- Login Screen -->
    <div id="loginScreen">
      <div id="loginBox">
        <h2>🏈 Retro Bowl</h2>
        <p style="color: #ccc;">Login or create an account</p>
        <input type="text" id="usernameInput" placeholder="Username" maxlength="20" autocomplete="off">
        <input type="password" id="passwordInput" placeholder="Password" maxlength="50" autocomplete="off">
        <button onclick="login()">Login / Create Account</button>
        <p id="loginMessage">Your progress saves to the cloud!</p>
      </div>
    </div>

    <!-- Save indicator -->
    <div id="saveIndicator" style="display: none;">
      <div id="saveStatus">Ready</div>
    </div>
    
    <div class="gm4html5_div_class" id="gm4html5_div_id">
      <img src="html5game/splash.png" id="GM4HTML5_loadingscreen" alt="GameMaker:HTML5 loading screen" style="display: none" />
      <canvas id="canvas" width="960" height="540">
        <p>Your browser doesn't support HTML5 canvas.</p>
      </canvas>
    </div>

    <script type="text/javascript" src="html5game/RetroBowl.js?WAEAC=1633155445"></script>
    <script src="/html/settings/js/index.js"></script>
    
    <script>
    // YOUR BACKEND URL - Replace this after deploying to Vercel!
    const BACKEND_URL = 'https://retrobowl-backend.vercel.app/api/saves';
    
    let username = '';
    let password = '';
    let gameStarted = false;
    
    // Show save indicator
    function updateSaveStatus(message, color = '#0f0') {
      const indicator = document.getElementById('saveIndicator');
      const status = document.getElementById('saveStatus');
      status.textContent = message;
      status.style.color = color;
      indicator.style.borderColor = color;
      indicator.style.display = 'block';
    }
    
    // Login function
    async function login() {
      const userInput = document.getElementById('usernameInput');
      const passInput = document.getElementById('passwordInput');
      const message = document.getElementById('loginMessage');
      
      username = userInput.value.trim();
      password = passInput.value.trim();
      
      if (!username) {
        message.textContent = 'Please enter a username';
        message.className = 'error';
        return;
      }
      
      if (username.length < 3) {
        message.textContent = 'Username must be at least 3 characters';
        message.className = 'error';
        return;
      }
      
      if (!password) {
        message.textContent = 'Please enter a password';
        message.className = 'error';
        return;
      }
      
      if (password.length < 6) {
        message.textContent = 'Password must be at least 6 characters';
        message.className = 'error';
        return;
      }
      
      // Only allow letters, numbers, underscore, hyphen for username
      if (!/^[a-zA-Z0-9_-]+$/.test(username)) {
        message.textContent = 'Username: only letters, numbers, _ and -';
        message.className = 'error';
        return;
      }
      
      username = username.toLowerCase();
      
      message.textContent = 'Loading your save...';
      message.className = 'success';
      
      // Load save data
      setTimeout(loadSaveData, 500);
    }
    
    // Load save data from backend
    async function loadSaveData() {
      try {
        updateSaveStatus('Loading save...', '#ff0');
        
        const response = await fetch(`${BACKEND_URL}?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`);
        
        if (response.ok) {
          const data = await response.json();
          if (data.success && data.saveData) {
            // Clear localStorage first
            localStorage.clear();
            
            // Load save data
            for (const key in data.saveData.saveData) {
              localStorage.setItem(key, data.saveData.saveData[key]);
            }
            
            updateSaveStatus('Save loaded!', '#0f0');
          } else {
            updateSaveStatus('Starting new game', '#ff0');
          }
        } else if (response.status === 404) {
          // No save found - new user
          updateSaveStatus('Welcome! Starting new game', '#ff0');
        } else {
          updateSaveStatus('Load failed, starting new game', '#f00');
        }
      } catch(e) {
        console.error('Load error:', e);
        updateSaveStatus('Error loading, starting new game', '#f00');
      }
      
      // Hide login screen and start game
      document.getElementById('loginScreen').style.display = 'none';
      startGame();
    }
    
    // Start the game
    function startGame() {
      if (!gameStarted) {
        gameStarted = true;
        if (typeof GameMaker_Init === 'function') {
          GameMaker_Init();
        }
        
        // Start auto-save every 30 seconds
        setInterval(saveToCloud, 30000);
        
        setTimeout(() => {
          updateSaveStatus('User: ' + username, '#0f0');
        }, 2000);
      }
    }
    
    // Save to backend
    async function saveToCloud() {
      const saveData = {};
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        saveData[key] = localStorage.getItem(key);
      }
      
      if (Object.keys(saveData).length > 0) {
        try {
          updateSaveStatus('Saving...', '#ff0');
          
          const response = await fetch(BACKEND_URL, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              username: username,
              password: password,
              saveData: saveData
            })
          });
          
          if (response.ok) {
            const data = await response.json();
            if (data.success) {
              updateSaveStatus('✓ Saved to cloud', '#0f0');
              setTimeout(() => {
                updateSaveStatus('User: ' + username, '#0f0');
              }, 2000);
            } else {
              updateSaveStatus('✗ Save failed', '#f00');
            }
          } else {
            updateSaveStatus('✗ Save failed: ' + response.status, '#f00');
          }
        } catch(e) {
          console.error('Save error:', e);
          updateSaveStatus('✗ Save failed', '#f00');
        }
      }
    }
    
    // Enter key to login
    document.getElementById('passwordInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        login();
      }
    });
    </script>
  </body>
</html>
